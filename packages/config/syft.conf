# Syft scan config (CLI: syft --config packages/config/syft.conf ...)
# Keeps build/scan scratch out of the SBOM: apk cache, temp scan outputs,
# and the scanning tools' own installed cache/state.
exclude:
  - "/tmp/**"
  - "/out/**"
  - "/sbom/**"
  - "/grype/**"
  - "/var/cache/apk/**"
  - "/root/.cache/**"
  - "**/.git/**"
